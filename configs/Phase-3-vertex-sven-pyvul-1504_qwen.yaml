# Phase 3: Qwen3-235B — SVEN + PyVul OWASP Top 10 experiment
# Part of Phase-3-vertex-sven-pyvul-1504 multi-model experiment
experiment_name: "Phase-3-vertex-sven-pyvul-1504-qwen"
run_description: >
  Phase 3 exploitation verification using Qwen3-235B on 100 files
  from SVEN and PyVul datasets covering OWASP Top 10 Python vulnerability types
  (CWE-79, CWE-89, CWE-22, CWE-78, CWE-502, CWE-94, CWE-287, CWE-601, CWE-918, CWE-352).

phase: "3"

# Vertex AI backend
vertex: true
vertex_config: "configs/Phase-3-vertex-sven-pyvul-1504_qwen.yaml"

# Model — Qwen3-235B A22B Instruct (global endpoint)
model: qwen/qwen3-235b-a22b-instruct-2507-maas
api_base: https://aiplatform.googleapis.com/v1/projects/vivid-grammar-475417-i1/locations/global/endpoints/openapi
api_key_env: VERTEX_ACCESS_TOKEN

reasoning_model: "qwen/qwen3-235b-a22b-instruct-2507-maas"

# Dataset — SVEN + PyVul OWASP Top 10 (100 file pairs)
input_dataset_dir: "vaitp_dataset/phase3_sven_pyvul"

max_iterations: 5
stream_llm: false
test_timeout: 300
trace_diagram: true
trace_detail_level: detailed
