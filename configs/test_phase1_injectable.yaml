# test_phase1_injectable.yaml
# -----------------------------------------------------------------------------
# Test Configuration for Phase 1 Plan Generation
#
# Objective:
#   Run the planning stage on the 'injectable_test' dataset to ensure
#   the reasoning model can correctly analyze the code and generate valid plans.
# -----------------------------------------------------------------------------

experiment_name: "test_phase1_injectable_dataset"
run_description: "A test run of Phase 1 on the 'injectable_test' directory."

# --- Phase Configuration ---
# Specifies that we are only running the planning phase.
phase: 1
stage: "generate"

# --- Model Selection ---
# Use the default reasoning model for this test.
reasoning_model: "llama-3.1-8b"

# --- Path Configuration ---
# The input directory for this specific test run.
input_dataset_dir: "vaitp_dataset/injectable_test"

# --- Performance Settings (optional) ---
# Set a reasonable timeout for this smaller test run.
timeout_per_model: 1800  # 30 minutes
