# test_phase2_large_models.yaml
# -----------------------------------------------------------------------------
# Phase 2 Test Configuration - Large Models (8B)
#
# Objective:
#   Test large models (8B) one at a time to prevent memory crashes
#   Run this ONLY if you have high-end hardware (32GB+ RAM)
# -----------------------------------------------------------------------------

experiment_name: "test_phase2_large_models"
run_description: "Phase 2 test with large models (8B) - requires 32GB+ RAM"

# --- Phase Configuration ---
phase: 2
stage: "all"

# --- Model Selection ---
# Large models - run ONE AT A TIME to avoid crashes
coders_to_run:
  - "Qwen-3-8B-Base"
  # Uncomment ONE model at a time:
  # - "Qwen3-8B-Finetuned"
  # - "Llama-3.1-8B-Base"
  # - "Llama-3.1-8B-Finetuned"

# --- Strategy Selection ---
strategies_to_run:
  - "DIRECT_ONLY"
  - "DIRECT_RAG"

# --- Data Paths ---
input_dataset_dir: "vaitp_dataset/injectable_test"
expected_dir: "vaitp_dataset/expected_test"

# --- Performance Settings ---
timeout_per_model: 2400  # 40 minutes per model

# --- Export Settings ---
export:
  save_excel: true
  excel_per_model: true