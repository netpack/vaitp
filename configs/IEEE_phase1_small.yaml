# IEEE_phase1_small.yaml
# -----------------------------------------------------------------------------
# Test Configuration for Phase 1 Plan Generation with Small Model
#
# Objective:
#   Run the planning stage on the 'injectable_poisonpy' dataset using a smaller
#   model that fits in available memory, to test the context window fixes.
# -----------------------------------------------------------------------------

experiment_name: "IEEE_phase1_small"
run_description: "A test run of Phase 1 with context window fixes using a smaller model."

# --- Phase Configuration ---
# Specifies that we are only running the planning phase.
phase: 1
stage: "generate"

# --- Model Selection ---
# Use a smaller reasoning model that fits in available memory
reasoning_model: "llama-3.2-1b"

# --- Path Configuration ---
# The input directory for this specific test run.
input_dataset_dir: "vaitp_dataset/injectable_poisonpy"

# --- Performance Settings (optional) ---
# Set a reasonable timeout for this smaller test run.
timeout_per_model: 1800  # 30 minutes