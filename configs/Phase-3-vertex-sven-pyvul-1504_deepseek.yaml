# Phase 3: DeepSeek R1-0528 — SVEN + PyVul OWASP Top 10 experiment
# Part of Phase-3-vertex-sven-pyvul-1504 multi-model experiment
experiment_name: "Phase-3-vertex-sven-pyvul-1504-deepseek"
run_description: >
  Phase 3 exploitation verification using DeepSeek R1-0528 on 140 files
  from SVEN and PyVul datasets covering OWASP Top 10 Python vulnerability types
  (CWE-79, CWE-89, CWE-22, CWE-78, CWE-502, CWE-94, CWE-287, CWE-601, CWE-918, CWE-352).

phase: "3"

# Vertex AI backend
vertex: true
vertex_config: "configs/Phase-3-vertex-sven-pyvul-1504_deepseek.yaml"

# Model — DeepSeek R1-0528 MaaS (us-central1, already enabled)
model: deepseek-ai/deepseek-r1-0528-maas
api_base: https://us-central1-aiplatform.googleapis.com/v1/projects/vivid-grammar-475417-i1/locations/us-central1/endpoints/openapi
api_key_env: VERTEX_ACCESS_TOKEN

reasoning_model: "deepseek-ai/deepseek-r1-0528-maas"

# Dataset — SVEN + PyVul OWASP Top 10 (100 file pairs)
input_dataset_dir: "vaitp_dataset/phase3_sven_pyvul"

max_iterations: 5
stream_llm: false
test_timeout: 300
trace_diagram: true
trace_detail_level: detailed
