# test_phase2_medium_models.yaml
# -----------------------------------------------------------------------------
# Phase 2 Test Configuration - Medium Models (7B)
#
# Objective:
#   Test medium-sized models (7B) separately to manage memory usage
#   Run this ONLY if you have sufficient RAM (16GB+)
# -----------------------------------------------------------------------------

experiment_name: "test_phase2_medium_models"
run_description: "Phase 2 test with medium models (7B) - requires 16GB+ RAM"

# --- Phase Configuration ---
phase: 2
stage: "all"

# --- Model Selection ---
# Medium models - run separately to avoid memory issues
coders_to_run:
  - "Qwen-2.5-7B-Base"
  - "Qwen2.5-7B-Finetuned"

# --- Strategy Selection ---
strategies_to_run:
  - "DIRECT_ONLY"
  - "DIRECT_RAG"

# --- Data Paths ---
input_dataset_dir: "vaitp_dataset/injectable_test"
expected_dir: "vaitp_dataset/expected_test"

# --- Performance Settings ---
timeout_per_model: 1800  # 30 minutes per model

# --- Export Settings ---
export:
  save_excel: true
  excel_per_model: true